      黑白轮流把棋子放在棋盘的交叉点上。
    </p>

    <p>
      <b>② 什么叫“气”？</b><br>
      一颗棋子的上下左右，如果还有空着的位置，
      那就是它的“气”。
    </p>

    <p>
      <b>③ 怎么吃棋子？</b><br>
      如果把对方棋子的气全部堵住，它们就会被吃掉。
    </p>

    <p>
      <b>④ 现在只记一句：</b><br>
      <strong>别让自己的棋子一点气都没有。</strong>
    </p>

    <div class="tip">

<script>

const SIZE = 9;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const messageEl = document.getElementById("message");

let board;
let turn;
let history;
let gameOver;

function createBoard(){

  return Array.from(
    {length:SIZE},
    ()=>Array(SIZE).fill(0)
  );

}

function copyBoard(b){

  return b.map(row=>row.slice());

}

function inside(x,y){

  return (
    x>=0 &&
    x<SIZE &&
    y>=0 &&
    y<SIZE
  );

}

function neighbors(x,y){

  return [
    [x-1,y],
    [x+1,y],
    [x,y-1],
    [x,y+1]
  ].filter(p=>inside(p[0],p[1]));

}

function getGroup(b,x,y){

  const color=b[x][y];

  const group=[];
  const visited=new Set();

  const stack=[[x,y]];

  while(stack.length){

    const [a,d]=stack.pop();
    const key=a+","+d;

    if(visited.has(key)) continue;

    visited.add(key);
    group.push([a,d]);

    for(const [nx,ny] of neighbors(a,d)){

      if(b[nx][ny]===color){
        stack.push([nx,ny]);
      }

    }

  }

  return group;

}

function getLiberties(b,group){

  const liberties=new Set();

  for(const [x,y] of group){

    for(const [nx,ny] of neighbors(x,y)){

      if(b[nx][ny]===0){

        liberties.add(nx+","+ny);

      }

    }

  }

  return liberties.size;

}

function sameBoard(a,b){

  return JSON.stringify(a)===JSON.stringify(b);

}

function testMove(x,y,color){

  if(board[x][y]!==0){

    return {
      ok:false,
      message:"这里已经有棋子啦。"
    };

  }

  const next=copyBoard(board);

  next[x][y]=color;

  let captured=0;

  for(const [nx,ny] of neighbors(x,y)){

    if(next[nx][ny]===-color){

      const enemy=getGroup(next,nx,ny);

      if(getLiberties(next,enemy)===0){

        for(const [gx,gy] of enemy){

          next[gx][gy]=0;
          captured++;

        }

      }

    }

  }

  const ownGroup=getGroup(next,x,y);

  if(getLiberties(next,ownGroup)===0){

    return {
      ok:false,
      message:"这一步会让你的棋子没有气，不能这样下。"
    };

  }

  if(
    history.length>0 &&
    sameBoard(next,history[history.length-1])
  ){

    return {
      ok:false,
      message:"这里涉及“劫”，现在不能马上走回来。"
    };

  }

  return {
    ok:true,
    board:next,
    captured:captured
  };

}

function play(x,y,color){

  const result=testMove(x,y,color);

  if(!result.ok){

    messageEl.textContent=result.message;

    return false;

  }

  history.push(copyBoard(board));

  board=result.board;

  turn=-turn;

  if(result.captured>0){

    messageEl.textContent=
      "吃掉了 "+result.captured+" 颗棋子！这就是“提子”。";

  }else{

    messageEl.textContent=
      "落得不错。现在看看你的棋子还有多少“气”。";

  }

  updateStatus();
  draw();

  return true;

}

function updateStatus(){

  if(gameOver){

    statusEl.textContent="这一局结束";

    return;

  }

  if(turn===1){

    statusEl.textContent="轮到你 · 黑棋";

  }else{

    statusEl.textContent="小G思考中 · 白棋";

  }

}

function newGame(){

  board=createBoard();

  turn=1;

  history=[];

  gameOver=false;

  messageEl.textContent=
    "不用紧张，你刚开始学。我会帮你判断这一步能不能下。";

  updateStatus();

  draw();

}

function undo(){

  if(
    history.length===0 ||
    turn!==1 ||
    gameOver
  ){

    return;

  }

  board=history.pop();

  turn=1;

  messageEl.textContent=
    "悔棋成功。换一个位置试试看。";

  updateStatus();

  draw();

}

function passTurn(){

  if(turn!==1 || gameOver) return;

  messageEl.textContent=
    "你停了一手，小G也会继续下。";

  turn=-1;

  updateStatus();

  aiMove();

}

function getLegalMoves(color){

  const moves=[];

  for(let x=0;x<SIZE;x++){

    for(let y=0;y<SIZE;y++){

      if(testMove(x,y,color).ok){

        moves.push([x,y]);

      }

    }

  }

  return moves;

}

function aiMove(){

  const moves=getLegalMoves(-1);

  if(moves.length===0){

    gameOver=true;

    messageEl.textContent=
      "小G没地方下了。我们先结束这一局吧。";

    updateStatus();

    return;

  }

  let best=moves[0];

  让bestScore=-999;

  为(Const移动 ……的 移动){

    Const [x,y]=移动;

    Const结果=testMove(x,y,-1);

    让分数=0;

    分数+=(结果.已捕获||0)*10;

    分数+=
      (4-数学.防抱死制动系统(x-4))+
      (4-数学.防抱死制动系统(y-4));

    分数+=数学.随机()*3;

    如果(分数>bestScore){

      bestScore=分数;
      最好的=移动;

    }

  }

  setTimeout(()=>{

    玩(最好的[0],最好的[1],-1);

  },500);

}
